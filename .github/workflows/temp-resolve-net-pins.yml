# Temporary, single-use digest resolver. Deleted before merge.
name: Resolve .NET image digests
on:
  push:
    branches: ["security/229-signed-manifests"]
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Resolve Microsoft manifest-list digests
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          path = pathlib.Path("Dockerfile")
          dockerfile = path.read_text()
          entries = [
              ("mcr.microsoft.com/dotnet/sdk", "10.0-alpine", "api-build"),
              ("mcr.microsoft.com/dotnet/aspnet", "10.0-alpine", "runtime"),
          ]
          for image, tag, stage in entries:
              source = f"{image}:{tag}"
              output = subprocess.check_output(["docker", "buildx", "imagetools", "inspect", source], text=True)
              match = re.search(r"^Digest:\s*(sha256:[0-9a-f]{64})\s*$", output, re.MULTILINE)
              if not match:
                  raise RuntimeError(f"Could not verify manifest-list digest for {source}")
              if stage == "runtime":
                  runtime_info = subprocess.check_output(
                      ["docker", "run", "--rm", source, "dotnet", "--list-runtimes"], text=True
                  )
                  print(runtime_info)
                  if "Microsoft.AspNetCore.App 10.0.13 " not in runtime_info:
                      raise RuntimeError(f"{source} does not yet include patched ASP.NET Core 10.0.13")
              replacement = f"FROM {source}@{match.group(1)} AS {stage}"
              dockerfile, count = re.subn(
                  rf"^FROM {re.escape(image)}:[^\n]+ AS {stage}$",
                  replacement, dockerfile, flags=re.MULTILINE
              )
              if count != 1:
                  raise RuntimeError(f"Expected exactly one FROM instruction for {stage}, found {count}")
              print(f"Resolved {source} to {match.group(1)}")
          path.write_text(dockerfile)
          PY
      - name: Commit digest pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "fix(security): pin October 2026 patched .NET 10 image digests"
          git push origin HEAD:"$GITHUB_REF_NAME"
