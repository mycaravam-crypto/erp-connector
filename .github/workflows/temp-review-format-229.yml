# Temporary formatter for reviewing issue 229; removed after formatting.
name: Review format 229
on:
  push:
    branches: [security/229-signed-manifests]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.x"
      - run: dotnet tool restore
      - run: dotnet csharpier format .
      - name: Commit format results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.cs'
          if ! git diff --cached --quiet; then
            git commit -m "style: CSharpier review fixes for #229"
            git push origin HEAD:security/229-signed-manifests
          fi
