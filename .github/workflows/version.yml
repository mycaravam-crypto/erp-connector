name: Version

# Bumps the VERSION file (the app's single version source — see Directory.Build.props) on every PR
# merged into main, commits it back, tags vX.Y.Z, publishes a GHCR image, and creates a GitHub Release. The running version is shown on the
# login screen and in the app footer (GET /api/version), so a Docker redeploy can be checked at a
# glance.
#
# Bump size comes from the merged PR's labels: `major` or `minor`, otherwise patch.

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # Credentials stay persisted on purpose: the job pushes the bump commit and tag back to main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0

      - name: Bump VERSION
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          IFS=. read -r major minor patch < VERSION
          case " $LABELS " in
            *" major "*) major=$((major + 1)); minor=0; patch=0 ;;
            *" minor "*) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Release v$VERSION (#$PR_NUMBER) [skip ci]"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      # The tag is pushed by GITHUB_TOKEN. That does not trigger another workflow,
      # so publish the OCI image and GitHub Release in this same version job.
      - name: Publish versioned container to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -t "$image:v$VERSION" -t "$image:latest" .
          docker push "$image:v$VERSION"
          docker push "$image:latest"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag --latest
