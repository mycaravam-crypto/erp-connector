name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.x"

      - name: Restore tool manifest
        run: dotnet tool restore

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .

      - name: Restore packages
        run: dotnet restore Connector.sln

      - name: Build (Release — warnings treated as errors)
        run: dotnet build Connector.sln -c Release --no-restore

      - name: Test
        run: dotnet test Connector.sln -c Release --no-build --verbosity normal

  frontend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/connector-ui

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/connector-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Check JS/TS code health (fallow)
        run: npm run check:fallow -- --base origin/main
