name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x"

      - name: Restore tool manifest
        run: dotnet tool restore

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .

      - name: Restore packages
        run: dotnet restore Connector.sln

      - name: Build (Release — warnings treated as errors)
        run: dotnet build Connector.sln -c Release --no-restore

      - name: Test
        run: dotnet test Connector.sln -c Release --no-build --verbosity normal

  frontend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/connector-ui

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/connector-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Check JS/TS code health (fallow)
        run: npm run check:fallow -- --base origin/main
