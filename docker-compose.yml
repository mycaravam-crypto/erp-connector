services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Override Auth:JwtSecret via env var — never commit a real secret
      Auth__JwtSecret: "REPLACE_WITH_SECURE_SECRET_MINIMUM_32_CHARS"
      ConnectionStrings__ExportLog: "Data Source=/data/db/export_log.db"
      ConnectionStrings__DemoErp: "Data Source=/data/db/demo_erp.db"
      ExportSink__StagingPath: "/data/staging"
      # AllowedOrigins__0: "https://your-frontend-domain.com"
    volumes:
      - connector-db:/data/db
      - connector-staging:/data/staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  connector-db:
  connector-staging:
