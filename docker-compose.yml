services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      Auth__JwtSecret: "${AUTH_JWT_SECRET}"

      Auth__Users__0__Username: "${AUTH_USER0_NAME}"
      Auth__Users__0__PasswordHash: "${AUTH_USER0_HASH}"
      Auth__Users__1__Username: "${AUTH_USER1_NAME}"
      Auth__Users__1__PasswordHash: "${AUTH_USER1_HASH}"

      ConnectionStrings__ExportLog: "Data Source=/data/db/export_log.db"
      ExportSink__StagingPath: "/data/staging"
      ImportSink__InboundPath: "/data/inbound"

      AllowedHosts: "*"
      # ExportWorker__ScheduledTimeUtc: "02:00"
      # ExportWorker__RetentionDays: "30"
      # ImportWorker__PollInterval: "00:00:30"
      # AllowedOrigins__0: "https://your-domain.com"
    volumes:
      - connector-db:/data/db
      # Security-review finding SR-11: previously shared connector-db with export_log.db (the encrypted
      # AppSetting.Value column's ciphertext). A backup/snapshot of a single volume must not hand over both
      # the ciphertext and the key needed to decrypt it — see appsettings.Production.json's DataProtection
      # comment.
      - connector-dpkeys:/data/dpkeys
      - connector-staging:/data/staging
      - connector-inbound:/data/inbound
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Security-review finding SR-03 (suggestion #3): container hardening additive to the Dockerfile's
    # existing non-root user. A .NET web app needs no Linux capabilities beyond what's already granted by
    # running unprivileged and binding a port >1024 — cap_drop/no-new-privileges cost this container
    # nothing. Resource limits are a starting point, not a measured figure: tune memory/cpus for your real
    # workload (export/import file sizes, concurrent requests) rather than trusting these as-is.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"

  # Local/test-only ERP source database — NOT part of the production stack.
  # Real deployments point Step 1 at the vendor's own PostgreSQL instance.
  # Start explicitly with: docker-compose --profile test up -d testdb
  testdb:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: erp_test
      POSTGRES_PASSWORD: erp_test_pw
      POSTGRES_DB: erp_testdb
    # Loopback-only: this is a local fixture with a fixed, published test password (see
    # testdb/init.sql), never meant to be reachable from anywhere but this host. Host-side tools
    # (dotnet test, dev.sh) still reach it at localhost:5432 exactly as before; only exposure to
    # other machines on the network changes.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./testdb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_test -d erp_testdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  connector-db:
  connector-dpkeys:
  connector-staging:
  connector-inbound:
